<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { overflow:hidden; }
  body {
    width:1400px; height:560px;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:
      radial-gradient(680px 460px at 92% 8%, rgba(139,92,246,0.20), transparent 60%),
      radial-gradient(560px 420px at 4% 96%, rgba(99,102,241,0.12), transparent 60%),
      linear-gradient(135deg,#161329 0%,#1c1738 55%,#241a47 100%);
    color:#fff;
    display:flex; align-items:center;
    padding:0 70px;
  }
  .wrap { display:flex; align-items:center; gap:56px; width:100%; }
  .left { flex:0 0 560px; }
  .right { flex:1; display:flex; align-items:center; justify-content:center; }

  .brand { display:flex; align-items:center; gap:16px; margin-bottom:30px; }
  .logo { width:44px; height:44px; border-radius:11px; background:#8b5cf6;
          display:flex; align-items:center; justify-content:center;
          font-size:24px; font-weight:800; color:#fff; box-shadow:0 8px 22px rgba(139,92,246,0.45); }
  .aa { font-size:30px; font-weight:800; letter-spacing:.5px; color:#efeaff; }

  h1 { font-size:58px; line-height:1.05; font-weight:800; letter-spacing:-1px; }
  h1 span { color:#a78bfa; }
  .sub { margin-top:22px; font-size:25px; line-height:1.4; color:#bcb2d9; font-weight:500; max-width:600px; }
  .chips { margin-top:34px; display:flex; gap:14px; }
  .chip { font-size:20px; font-weight:600; color:#e4dcff; padding:11px 20px; border-radius:999px;
          background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); }
  .chip.g { color:#c4b5fd; border-color:rgba(167,139,250,0.4); background:rgba(139,92,246,0.12); }

  .flow { display:flex; align-items:center; gap:28px; }
  /* image with text */
  .img { width:250px; height:300px; border-radius:18px; position:relative; overflow:hidden;
         background:linear-gradient(160deg,#3a2d63,#2a2150);
         border:1px solid rgba(255,255,255,0.10);
         box-shadow:0 24px 60px rgba(0,0,0,0.45); }
  .img .mount { position:absolute; bottom:0; left:0; right:0; height:120px;
                background:linear-gradient(#6d4fc2,#4b3a8c); clip-path:polygon(0 55%,28% 20%,52% 60%,74% 24%,100% 58%,100% 100%,0 100%); }
  .img .sun { position:absolute; top:36px; right:40px; width:52px; height:52px; border-radius:50%;
              background:radial-gradient(circle,#fde68a,#f59e0b); box-shadow:0 0 30px rgba(245,158,11,0.6); }
  .img .cap { position:absolute; top:18px; left:18px; right:18px;
              font-size:22px; font-weight:800; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.5);
              font-family:Georgia,serif; letter-spacing:.5px; }
  .img .badge { position:absolute; bottom:16px; left:18px; font-size:14px; font-weight:700;
                color:#fff; background:rgba(0,0,0,0.35); padding:5px 11px; border-radius:7px; }

  .arrow { display:flex; flex-direction:column; align-items:center; color:#a78bfa; }
  .arrow .a { font-size:56px; line-height:1; font-weight:300; }

  /* extracted text */
  .doc { width:290px; height:300px; border-radius:18px; padding:28px 26px;
         background:#f6f4ff; color:#0f0a24;
         box-shadow:0 24px 60px rgba(0,0,0,0.45); }
  .doc .t { font-size:14px; font-weight:800; color:#8b7fb5; letter-spacing:1.5px; margin-bottom:20px;
            display:flex; align-items:center; gap:8px; }
  .doc .t::before { content:""; width:10px; height:10px; border-radius:3px; background:#8b5cf6; }
  .doc .ln { height:15px; border-radius:7px; background:#e2ddf2; margin-bottom:16px; }
  .doc .ln.a { width:100%; background:#cabfec; }
  .doc .ln.b { width:86%; }
  .doc .ln.hl { background:rgba(139,92,246,0.35); width:60%; }
  .doc .ln.c { width:92%; background:#cabfec; }
  .doc .ln.d { width:70%; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="brand">
        <div class="logo">T</div>
        <div class="aa">OCR</div>
      </div>
      <h1>Extract Text<br>from <span>Image</span></h1>
      <div class="sub">Pull text from any screenshot or photo in one click. Runs on your device.</div>
      <div class="chips">
        <div class="chip g">Screenshots</div>
        <div class="chip">On&#8209;device OCR</div>
        <div class="chip">Copy or TXT</div>
      </div>
    </div>
    <div class="right">
      <div class="flow">
        <div class="img">
          <div class="cap">Hello World</div>
          <div class="sun"></div>
          <div class="mount"></div>
          <div class="badge">photo.jpg</div>
        </div>
        <div class="arrow"><div class="a">&#8594;</div></div>
        <div class="doc">
          <div class="t">EXTRACTED TEXT</div>
          <div class="ln a"></div>
          <div class="ln b"></div>
          <div class="ln hl"></div>
          <div class="ln c"></div>
          <div class="ln d"></div>
          <div class="ln b"></div>
          <div class="ln d"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
